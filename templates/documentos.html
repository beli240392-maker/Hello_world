{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>📁 Gestor de Documentos</h2>
</div>

<div class="row g-3">
  <div class="col-md-4">
    <a href="{{ url_for('documentos_empresa') }}" class="text-decoration-none">
      <div class="card shadow-sm h-100 border-primary">
        <div class="card-body text-center py-4">
          <div style="font-size: 3rem;">🏢</div>
          <h5 class="mt-2 text-primary">Empresa</h5>
          <p class="text-muted small">Documentos legales, planos generales y otros.</p>
        </div>
      </div>
    </a>
  </div>

  {% for lot in lotizaciones %}
  <div class="col-md-4">
    <a href="{{ url_for('documentos_lotizacion', lotizacion_id=lot.id) }}" class="text-decoration-none">
      <div class="card shadow-sm h-100 border-success">
        <div class="card-body text-center py-4">
          <div style="font-size: 3rem;">🏘️</div>
          <h5 class="mt-2 text-success">{{ lot.nombre }}</h5>
          <p class="text-muted small">Ver documentos por manzana o cliente.</p>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>

{% endblock %}
